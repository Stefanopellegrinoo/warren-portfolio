name: CI

# Only `push`: this is a single-author repo, so same-repo PRs already show the
# push check. Adding `pull_request` would just double every run.
on: push

# Least privilege for GITHUB_TOKEN; `image` raises its own scope to push to GHCR.
# Actions are pinned to commit SHAs: a moved tag cannot push an image that deploy runs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # matches node:22-alpine in the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      # Errors fail the job; baselined rules are warnings (see eslint.config.mjs).
      # `next build` is not run here: next.config.js sets ignoreDuringBuilds.
      - run: npm run lint

  image:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Sin esto el runner usa el driver `docker`, que no soporta exportar cache:
      # `cache-to: type=gha` falla con "Cache export is not supported for the docker driver".
      # setup-buildx crea un builder con driver `docker-container`, que sí.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Lowercase literal, NOT ${{ github.repository }}: the owner is
          # `Stefanopellegrinoo` and GHCR rejects uppercase in a repository name.
          tags: |
            ghcr.io/stefanopellegrinoo/warren-portfolio:latest
            ghcr.io/stefanopellegrinoo/warren-portfolio:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # ssh directo en vez de una action de terceros: el secret es una clave que entra a prod,
      # y una action de terceros la ve entera. Son cinco lineas, no vale la pena delegarlas.
      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # sin comando: la clave esta restringida con command=... en authorized_keys del box,
          # asi que ejecuta el script de deploy y nada mas, aunque se filtre.
          # -n cierra stdin: sin eso el comando remoto puede quedarse esperando entrada
          # y la sesion no cierra nunca (probado, colgo 180s). Esta invocacion exacta
          # se verifico end-to-end contra el VPS antes de commitear.
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST"
