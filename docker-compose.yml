
services:
  redis:
    image: redis:alpine
    # noeviction, NO allkeys-lru: este Redis no es solo cache, guarda las definiciones de los
    # jobs repetibles de BullMQ (incluido el snapshot diario). Con una politica de eviction,
    # al llegar al tope de memoria Redis puede borrar ese schedule sin un solo error visible,
    # y se pierde historia medida que no se puede reconstruir. Con noeviction, una escritura
    # que no entra falla RUIDOSAMENTE, que es lo que queremos. Uso real: 13MB contra 128 de tope.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    # SIN `ports:` a propósito. Con IP pública, publicar 6379 expone Redis a internet.
    # La app lo alcanza por el nombre del service en la red interna: redis://redis:6379
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - warren-network

  app:
    # La imagen la construye el CI (.github/workflows/ci.yml) y se baja de GHCR.
    # El box no buildea: `next build` pide 1.5GB de RSS, medido.
    image: ghcr.io/stefanopellegrinoo/warren-portfolio:latest
    restart: unless-stopped
    ports:
      # Loopback only: the warren-cloudflared tunnel runs with --network host and targets
      # localhost:3033. Docker's iptables rules bypass ufw, so a bare "3033:3000" would
      # listen on the public IP and skip Cloudflare.
      - "127.0.0.1:3033:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=${REDIS_URL}
      # Push notifications (odd/tasks/push-notificaciones.md S5): the app hands the public key to the
      # phone at runtime (GET /api/push) and sends the test notification.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - PORT=3000
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 only,
      # while the Next server listens on 0.0.0.0 (IPv4), so localhost gets ECONNREFUSED.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - warren-network

  worker:
    image: ghcr.io/stefanopellegrinoo/warren-portfolio:latest
    command: npm run worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=${REDIS_URL}
      # Push notifications (odd/tasks/push-notificaciones.md S5): the worker signs and sends them.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - warren-network

networks:
  warren-network:
    driver: bridge

volumes:
  redis_data:
